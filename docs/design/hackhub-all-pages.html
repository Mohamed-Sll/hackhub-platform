home:{name:'Home',html:()=>`<div class="hero-home"><div><p class="eyebrow">The open-source workspace for hackathons</p><h1>Make room<br>for <span>big ideas.</span></h1><p>Find an event and register in minutes, with no account required. Organizers get one clear workspace to publish details and run the day.</p><div class="row" style="margin-top:20px"><button class="btn" data-route="events">Explore events <span>↗</span></button><button class="btn secondary" data-route="login">Sign in</button></div></div><div class="orbit"><span class="orb-label one">Discover</span><span class="orb-label two">Build</span><span class="orb-label three">Celebrate</span><div class="orbit-core">H.</div></div></div><div class="grid g4" style="margin-top:16px"><div class="stat"><label>Public events</label><b>24</b></div><div class="stat"><label>Participants</label><b>1.8k</b></div><div class="stat"><label>Projects</label><b>326</b></div><div class="stat"><label>Teams formed</label><b>142</b></div></div><div class="section-head"><h2>One event, one clear workflow</h2><span>01 / 03</span></div><div class="grid g3"><div class="panel"><p class="eyebrow">01 — Publish</p><h3>Set the brief</h3><p class="muted small">Dates, challenges, rules and the details people need before they arrive.</p></div><div class="panel"><p class="eyebrow">02 — Build</p><h3>Bring people together</h3><p class="muted small">Registrations, teams and projects stay connected to the event.</p></div><div class="panel"><p class="eyebrow">03 — Recognize</p><h3>Close with clarity</h3><p class="muted small">Evaluate submissions, publish results and verify certificates.</p></div></div><div class="section-head"><h2>Coming up</h2><button class="btn secondary smallbtn" data-route="events">All events ↗</button></div>${eventRows()}`},
events:{name:'Discover events',html:()=>`<div class="title-row"><div><p class="eyebrow">Find your next build</p><h1>Events<span style="color:var(--orange)">.</span></h1><p>Explore public hackathons. Open an event to see its plan and sign-up details.</p></div><button class="btn" data-route="login">Sign in <span>↗</span></button></div><div class="toolbar"><input class="input" aria-label="Search events" placeholder="Search events, locations, themes…"><button class="tab active" data-filter="all">All events</button><button class="tab" data-filter="open">Registration open</button><button class="tab" data-filter="in_progress">In progress</button><button class="tab" data-filter="closed">Completed</button><span class="quiet small" style="margin-left:auto">3 sample events</span></div>${eventRows()}<div id="eventsEmpty" class="empty" hidden><div class="symbol">⌕</div><h3>No events match</h3><p>Try another search or status filter.</p></div><div class="row" style="justify-content:center;margin-top:22px"><button class="btn secondary smallbtn">← Previous</button><span class="small muted">Sample view · 3 events</span><button class="btn secondary smallbtn">Next →</button></div>`},
event:{name:'Event details',html:()=>`<p class="eyebrow">Events / Praia, Cape Verde</p><div class="poster"><div class="row" style="justify-content:space-between"><span class="pill live">● Registrations open</span><span class="quiet small">12—14 JUN 2027</span></div><div><p class="eyebrow">Atlantic Build Jam · Edition 04</p><h2>Build for the<br>islands ahead.</h2><p>48 hours to turn local challenges into digital products with lasting impact.</p></div><div class="poster-foot"><div class="meta"><div><small>Location</small><b>Praia, Cabo Verde</b></div><div><small>Format</small><b>In person</b></div><div><small>Registered</small><b>84 people</b></div></div><button class="btn" data-route="registerEvent">Register now ↗</button></div></div><div class="tabs" role="tablist" aria-label="Event information" data-tab-kind="publicEvent"><button class="tab active" role="tab" aria-selected="true">Overview</button><button class="tab" role="tab" aria-selected="false">Challenges</button><button class="tab" role="tab" aria-selected="false">Teams</button><button class="tab" role="tab" aria-selected="false">Ranking</button><button class="tab" role="tab" aria-selected="false">FAQ</button></div><div class="grid g2" data-tab-panel="publicEvent"><section><h2>About this event</h2><p class="muted">A weekend for makers, designers and builders to work on ideas connected to island life. Bring a team or meet collaborators on site.</p><div class="section-head"><h3>What to expect</h3></div><div class="row"><span class="pill signal">48 hours</span><span class="pill">Beginner friendly</span><span class="pill">Mentors on site</span></div></section><aside class="panel"><p class="eyebrow">At a glance</p><p><b>12 June 2027, 09:30</b><br><span class="muted small">Check-in opens</span></p><hr class="rule"><p><b>Hosted by Atlantic Makers</b><br><span class="muted small">Event organizer</span></p><hr class="rule"><button class="btn" style="width:100%;justify-content:center" data-route="registerEvent">Join this hackathon ↗</button></aside></div>`},
registerEvent:{name:'Event registration',html:()=>`<p class="eyebrow">Atlantic Build Jam / Registration</p><div class="grid g2" style="align-items:start"><section><h1 style="font-size:44px;letter-spacing:-.065em;line-height:.98">Save your<br>place<span style="color:var(--orange)">.</span></h1><p class="muted">Registration takes about a minute. No account is needed.</p><div class="panel soft" style="margin-top:22px"><span class="pill live">● Open</span><h3>Atlantic Build Jam</h3><p class="small muted">12—14 June 2027 · Praia, Cabo Verde · In person</p><p class="small muted">Your name and email are shared with the event organizer so they can manage attendee registration.</p></div></section><form class="panel"><p class="eyebrow">Participant details</p><div class="field"><label for="registration-name">Full name</label><input id="registration-name" name="name" autocomplete="name" required class="input" placeholder="Your name"></div><div class="field" style="margin-top:14px"><label for="registration-email">Email address</label><input id="registration-email" name="email" type="email" autocomplete="email" required class="input" placeholder="you@example.com"></div><label class="row small muted" style="margin-top:15px"><input type="checkbox" required> I agree to share these details with the event organizer.</label><button class="btn" type="submit" style="width:100%;justify-content:center;margin-top:18px">Complete registration ↗</button><p class="quiet small" style="text-align:center">Already registered? Contact the event organizer.</p></form></div>`},
dashboard:{name:'Organizer overview',html:()=>`<div class="title-row"><div><p class="eyebrow">Organizer workspace</p><h1>Overview<span style="color:var(--orange)">.</span></h1><p>Your events, activity and next actions in one place.</p></div><button class="btn" data-route="manageEvents">＋ Create event</button></div><div class="grid g4"><div class="stat"><label>Your events</label><b>4</b><span class="stat-hint positive">↑ 1 published this month</span></div><div class="stat"><label>Registrations</label><b>284</b><span class="stat-hint positive">↑ 18% vs. last month</span></div><div class="stat"><label>Teams</label><b>32</b><span class="stat-hint">Across 4 events</span></div><div class="stat"><label>Projects</label><b>26</b><span class="stat-hint">8 submitted</span></div></div><div class="grid g2" style="margin-top:16px"><div class="panel"><div class="section-head" style="margin-top:0"><h3>Event activity</h3><span>SAMPLE ACTIVITY</span></div><div style="height:150px;display:flex;align-items:end;gap:9px;border-bottom:1px solid var(--line);padding:0 6px">${[38,55,43,74,62,94,68,100,81,88,64,96].map((h,i)=>`<i style="height:${h}%;flex:1;display:block;border-radius:5px 5px 0 0;background:${i===11?'var(--orange)':'color-mix(in srgb,var(--blue) 48%,var(--surface2))'}"></i>`).join('')}</div><div class="row small muted" style="justify-content:space-between;margin-top:9px"><span>WEEK 01</span><span>WEEK 02</span><span>WEEK 03</span><span>WEEK 04</span></div></div><div class="panel"><div class="section-head" style="margin-top:0"><h3>Next action</h3><span>ATLANTIC BUILD JAM</span></div><p style="font-size:22px;letter-spacing:-.04em;font-weight:650">Review registrations</p><p class="muted small">18 new participants have joined since your last visit.</p><button class="btn secondary smallbtn" data-route="manageEvent">Open event workspace ↗</button><hr class="rule"><span class="pill warm">Event starts · 12 JUN 2027</span></div></div><div class="section-head"><h2>Recent events</h2><button class="btn secondary smallbtn" data-route="manageEvents">Manage all ↗</button></div>${eventRows()}`},
manageEvents:{name:'Manage events',html:()=>`<div class="title-row"><div><p class="eyebrow">Organizer workspace</p><h1>Manage events<span style="color:var(--orange)">.</span></h1><p>Create, publish and operate your hackathons.</p></div><button class="btn" data-route="manageEvent">＋ New event</button></div><div class="toolbar"><input class="input" aria-label="Search your events" placeholder="Search your events…"><button class="tab active" data-filter="all">All</button><button class="tab" data-filter="published">Published</button><button class="tab" data-filter="draft">Drafts</button><span class="quiet small" style="margin-left:auto">3 events</span></div><div class="table-wrap panel" style="padding:7px 14px"><table class="table"><thead><tr><th>Event</th><th>Status</th><th>Dates</th><th>Registrations</th><th></th></tr></thead><tbody><tr data-organizer-status="published"><td><div class="row"><span class="initial">AB</span><div><b>Atlantic Build Jam</b><div class="quiet">Praia · In person</div></div></div></td><td><span class="pill live">Published</span></td><td>12—14 Jun</td><td>84</td><td><button class="btn secondary smallbtn" data-route="manageEvent">Open ↗</button></td></tr><tr data-organizer-status="published"><td><div class="row"><span class="initial">CI</span><div><b>Code for Islands</b><div class="quiet">Mindelo · Hybrid</div></div></div></td><td><span class="pill signal">Published</span></td><td>28—29 Jun</td><td>32</td><td><button class="btn secondary smallbtn" data-route="manageEvent">Open ↗</button></td></tr><tr data-organizer-status="published"><td><div class="row"><span class="initial">OS</span><div><b>Open Source Weekend</b><div class="quiet">Online</div></div></div></td><td><span class="pill live">Published</span></td><td>04—05 Jul</td><td>0</td><td><button class="btn secondary smallbtn" data-route="manageEvent">Open ↗</button></td></tr></tbody></table></div>`},

ady to host?</h3><p class="muted small">Add the event schedule and at least one challenge so participants know what to expect.</p><div style="height:7px;background:var(--line);border-radius:10px;margin:18px 0"><div style="width:72%;height:100%;background:var(--orange);border-radius:10px"></div></div><div class="row" style="justify-content:space-between"><span class="small">Event setup</span><b class="small">72%</b></div><hr class="rule"><button class="btn secondary smallbtn">Continue setup ↗</button></div></div></div>`},

teams:{name:'My teams',html:()=>`<div class="title-row"><div><p class="eyebrow">Your collaborations</p><h1>My teams<span style="color:var(--orange)">.</span></h1><p>Projects and people connected to your events.</p></div><button class="btn" data-action="join-code">＋ Join with code</button></div><div class="grid g2"><article class="panel"><div class="row" style="justify-content:space-between"><span class="pill signal">ATLANTIC BUILD JAM</span><span class="pill live">3 / 5 members</span></div><div class="row" style="margin-top:18px"><span class="initial" style="width:46px;height:46px;border-radius:15px;font-size:14px">OC</span><div><h3 style="margin:0">Ocean Coders</h3><span class="small muted">Project: TideWatch</span></div></div><div class="row" style="margin:17px 0"><span class="avatar">M</span><span class="avatar">J</span><span class="avatar">D</span><span class="small muted">Mohamed · Joana · David</span></div><hr class="rule"><div class="row" style="justify-content:space-between"><span class="small muted">Submission opens 14 JUN 2027</span><button class="btn secondary smallbtn" data-route="team">Open team ↗</button></div></article><article class="panel soft"><div class="row" style="justify-content:space-between"><span class="pill">CODE FOR ISLANDS</span><span class="pill">Invite pending</span></div><h3 style="margin-top:22px">Island Stack</h3><p class="small muted">Waiting for the team leader to accept your invitation.</p><button class="btn ghost smallbtn">View event ↗</button></article></div>`},
team:{name:'Team workspace',html:()=>`<p class="eyebrow">My teams / Ocean Coders</p><div class="title-row"><div><h1>Ocean Coders<span style="color:var(--orange)">.</span></h1><p>Atlantic Build Jam · Team leader: Mohamed Sillah</p></div><button class="btn secondary" data-action="invite-member">Invite member ＋</button></div><div class="tabs"><button class="tab active">Workspace</button><button class="tab">Members</button><button class="tab">Project</button><button class="tab">Activity</button></div><div class="grid g2"><div class="panel"><div class="section-head" style="margin-top:0"><h3>Team members</h3><span>3 / 5</span></div>${['Mohamed Sillah · Leader','Joana Monteiro','David Neves'].map((n,i)=>`<div class="listrow"><span class="initial">${n.split(' ').map(x=>x[0]).join('')}</span><div><strong>${n.split(' ·')[0]}</strong><p>${i===0?'Team leader':'Member · accepted'}</p></div>${i===0?'<span class="pill warm">You</span>':'<span class="quiet">•••</span>'}<span></span></div>`).join('')}</div><div class="panel soft"><p class="eyebrow">Shared project</p><h2 style="font-size:27px;letter-spacing:-.05em">TideWatch</h2><p class="muted small">A community tool to track tide changes and coastal risk.</p><div class="row" style="margin:15px 0"><span class="pill signal">In progress</span><span class="pill">Challenge: Blue Economy</span></div><button class="btn">Open project ↗</button><hr class="rule"><span class="small muted">Submission opens · 14 JUN 2027, 17:00</span></div></div>`},
profile:{name:'Profile',html:()=>`<p class="eyebrow">Your account / Profile</p><div class="grid g2" style="align-items:start"><section class="panel"><div class="row" style="align-items:start"><div class="avatar" style="width:64px;height:64px;font-size:20px">M</div><div><h1 style="font-size:30px;letter-spacing:-.05em;margin:0">Mohamed Sillah</h1><p class="small muted">Organizer · Member since 2025</p></div></div><hr class="rule"><div class="section-head" style="margin-top:0"><h3>About</h3><button class="btn secondary smallbtn" data-action="edit-profile">Edit profile</button></div><p class="muted small">Building tools for communities, events and open collaboration.</p><div class="section-head"><h3>Skills</h3></div><div class="row"><span class="pill signal">React</span><span class="pill signal">TypeScript</span><span class="pill signal">Python</span></div><hr class="rule"><p class="small muted">Email · sillah@example.com</p></section><aside><div class="panel"><p class="eyebrow">Preferences</p><div class="row" style="justify-content:space-between"><div><b class="small">Appearance</b><p class="quiet small">Use the theme toggle in the header</p></div><span class="pill">System</span></div></div><div class="panel" style="margin-top:14px"><p class="eyebrow">Account security</p><div class="row" style="justify-content:space-between"><span class="small">Password</span><button class="btn secondary smallbtn" data-route="forgot">Change ↗</button></div><hr class="rule"><div class="row" style="justify-content:space-between"><span class="small">Email status</span><span class="pill live">Verified</span></div></div></aside></div>`},
login:{name:'Sign in',html:()=>authPage('Welcome back','Sign in to continue to your teams, projects and event tools.','Email address','Password','Sign in','New to HackHub? Create an organizer account.','register','forgot')},

verifyEmail:{name:'Verify your email',html:()=>`<div class="auth-wrap"><aside class="auth-aside"><div><p class="eyebrow">One last step</p><h2>Check your<br>inbox<span style="color:var(--orange)">.</span></h2><p>Verification keeps organizer accounts and event ownership secure.</p></div><span class="quiet small">HACKHUB / ACCOUNT SETUP</span></aside><section class="auth-form" style="align-items:start"><div class="verify-mark">✉</div><h1>Verify your email</h1><p class="muted small">We sent a verification link to <b>m••••@example.com</b>. Open it to finish setting up your account.</p><button class="btn" data-route="dashboard">I verified my email</button><button class="btn secondary">Resend verification email</button><div class="auth-links"><span>Wrong address?</span><a class="link" data-route="register">Update account details</a></div></section></div>`},

function eventRows(){return `<div class="listrow" data-route="event" data-event-status="open"><div class="date"><b>12</b><small>Jun</small></div><div><strong>Atlantic Build Jam</strong><p>Praia, Cabo Verde · 12—14 June 2027</p></div><span class="pill live hide-mobile">Registration open</span><span class="arrow">↗</span></div><div class="listrow" data-route="event" data-event-status="open"><div class="date"><b>28</b><small>Jun</small></div><div><strong>Code for Islands</strong><p>Mindelo · 28—29 June 2027</p></div><span class="pill live hide-mobile">Registration open</span><span class="arrow">↗</span></div><div class="listrow" data-route="event" data-event-status="upcoming"><div class="date"><b>04</b><small>Jul</small></div><div><strong>Open Source Weekend</strong><p>Online · 4—5 July 2027</p></div><span class="pill hide-mobile">Registration opens soon</span><span class="arrow">↗</span></div>`}
function authPage(title,desc,first,second,cta,foot,dest,extra){const fields=first?`<div class="field"><label for="auth-primary">${first}</label><input id="auth-primary" class="input" ${first.includes('Email')?'type="email" autocomplete="email"':'autocomplete="name"'} placeholder="${first.includes('Email')?'you@example.com':first==='Full name'?'Your full name':'••••••••'}"></div>`:'';const password=second?`<div class="field"><label for="auth-password">${second}</label><input id="auth-password" class="input" type="password" autocomplete="current-password" placeholder="Enter ${second.toLowerCase()}"></div>`:'';return `<div class="auth-wrap"><aside class="auth-aside"><div><p class="eyebrow">HackHub / Account access</p><h2>Make the<br>event happen<span style="color:var(--orange)">.</span></h2><p>Plan in one place. Publish to everyone. Keep the event moving.</p></div><span class="quiet small">BUILT FOR PEOPLE WHO BRING BUILDERS TOGETHER</span></aside><form class="auth-form"><p class="eyebrow">HackHub account</p><h1>${title}</h1><p class="muted small">${desc}</p>${fields}${password}${extra==='forgot'?`<div class="auth-links"><span></span><a class="link" data-route="forgot">Forgot password?</a></div>`:''}<button class="btn" type="submit">${cta} ↗</button><div class="auth-links"><span>${foot.split('?')[0]}</span><a class="link" data-route="${dest}">${foot.split('?')[1]||'Continue'}</a></div></form></div>`}
const allItems=routeGroups.flatMap(group=>group.items);
const routePaths=new Map(allItems.map(([key,,, path])=>[key,path]));
const screen=document.getElementById('screen');
const app=document.getElementById('app');
const rail=document.getElementById('rail');
const backdrop=document.getElementById('backdrop');
const toast=document.getElementById('toast');
let active='home';
let toastTimer;
let activeDialog=null;
let returnFocus=null;

function notify(message,warning=false){
  toast.textContent=message;
  toast.classList.toggle('warning',warning);
  toast.classList.add('show');
  window.clearTimeout(toastTimer);
  toastTimer=window.setTimeout(()=>toast.classList.remove('show'),3400);
}

function closeDialog(){
  if(!activeDialog)return;
  activeDialog.remove();
  activeDialog=null;
  document.body.classList.remove('modal-open');
  returnFocus?.focus();
}

function openDialog(kind,trigger){
  const views={
    'create-event':{eyebrow:'Organizer workspace / New event',title:'Start with the essentials',description:'Save a private draft first. You can add challenges, schedule and rules before publishing.',fields:`<div class="field"><label for="new-event-title">Event name</label><input id="new-event-title" name="title" class="input" required placeholder="e.g. Atlantic Build Jam"></div><div class="field"><label for="new-event-location">Location</label><input id="new-event-location" name="location" class="input" placeholder="City or online"></div><div class="dialog-grid"><div class="field"><label for="new-event-start">Starts</label><input id="new-event-start" name="start" type="date" class="input"></div><div class="field"><label for="new-event-end">Ends</label><input id="new-event-end" name="end" type="date" class="input"></div></div>`,submit:'Save draft'},
    'join-code':{eyebrow:'Your space / Join a team',title:'Enter your invite code',description:'Ask a team leader for the event-specific code. It is only visible to accepted members.',fields:`<div class="field"><label for="invite-code">Team invite code</label><input id="invite-code" name="code" class="input" required autocomplete="off" placeholder="e.g. OCEAN-7K2"></div>`,submit:'Check code'},
    'invite-member':{eyebrow:'Ocean Coders / Invite',title:'Bring someone into the team',description:'The invite is tied to this hackathon and can be accepted from the member’s account.',fields:`<div class="field"><label for="member-email">Member email</label><input id="member-email" name="email" type="email" class="input" required autocomplete="email" placeholder="teammate@example.com"></div>`,submit:'Send invitation'},
    'edit-profile':{eyebrow:'Your account / Profile',title:'Make your profile yours',description:'Keep your public details focused on the work you want to share.',fields:`<div class="field"><label for="profile-name">Full name</label><input id="profile-name" name="name" class="input" value="Mohamed Sillah"></div><div class="field"><label for="profile-bio">Bio</label><textarea id="profile-bio" name="bio" class="input" placeholder="What do you build?"></textarea></div><div class="field"><label for="profile-skills">Skills</label><input id="profile-skills" name="skills" class="input" value="React, TypeScript, Python"></div>`,submit:'Save profile'}
  };
  const view=views[kind];
  if(!view)return;
  closeDialog();
  returnFocus=trigger;
  activeDialog=document.createElement('div');
  activeDialog.className='dialog-layer';
  activeDialog.innerHTML=`<section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" aria-describedby="dialog-description"><div class="dialog-head"><div><p class="eyebrow">${view.eyebrow}</p><h2 id="dialog-title">${view.title}</h2><p class="dialog-description" id="dialog-description">${view.description}</p></div><button class="dialog-close" type="button" aria-label="Close dialog">×</button></div><form><div style="margin-top:20px">${view.fields}</div><div class="dialog-actions"><button class="btn secondary" type="button" data-dialog-cancel>Cancel</button><button class="btn" type="submit">${view.submit}</button></div></form></section>`;
  document.body.appendChild(activeDialog);
  document.body.classList.add('modal-open');
  activeDialog.querySelector('.dialog-close').onclick=closeDialog;
  activeDialog.querySelector('[data-dialog-cancel]').onclick=closeDialog;
  activeDialog.addEventListener('click',event=>{if(event.target===activeDialog)closeDialog();});
  activeDialog.querySelector('form').addEventListener('submit',event=>{
    event.preventDefault();
    const submit=activeDialog.querySelector('[type="submit"]').textContent.trim();
    closeDialog();
    notify(`${submit} is a preview only; nothing was saved or sent.`,true);
  });
  activeDialog.querySelector('input,textarea')?.focus();
}

function closeDrawer(){
  rail.classList.remove('drawer-open');
  backdrop.classList.remove('visible');
  const toggle=document.getElementById('mobileToggle');
  toggle.setAttribute('aria-expanded','false');
  toggle.setAttribute('aria-label','Open page navigation');
}

function applyEventFilters(){
  const rows=[...screen.querySelectorAll('.listrow[data-event-status]')];
  const query=(screen.querySelector('input[aria-label="Search events"]')?.value||'').trim().toLowerCase();
  const filter=screen.querySelector('.toolbar [data-filter].active')?.dataset.filter||'all';
  let visible=0;
  rows.forEach(row=>{
    const matchesText=row.textContent.toLowerCase().includes(query);
    const matchesStatus=filter==='all'||row.dataset.eventStatus===filter;
    row.hidden=!(matchesText&&matchesStatus);
    if(!row.hidden)visible++;
  });
  const empty=screen.querySelector('#eventsEmpty');
  if(empty){empty.hidden=visible>0;empty.querySelector('p').textContent='Try another search or status filter.';}
}

function applyOrganizerFilters(){
  const query=(screen.querySelector('input[aria-label="Search your events"]')?.value||'').trim().toLowerCase();
  const filter=screen.querySelector('.toolbar [data-filter].active')?.dataset.filter||'all';
  const rows=[...screen.querySelectorAll('tbody tr[data-organizer-status]')];
  let visible=0;
  rows.forEach(row=>{
    const matchesText=row.textContent.toLowerCase().includes(query);
    const matchesStatus=filter==='all'||row.dataset.organizerStatus===filter;
    row.hidden=!(matchesText&&matchesStatus);
    if(!row.hidden)visible++;
  });
  let empty=screen.querySelector('#manageEventsEmpty');
  if(!empty){
    empty=document.createElement('div');
    empty.id='manageEventsEmpty';
    empty.className='empty';
    empty.innerHTML='<div class="symbol">⌕</div><h3>No events match</h3><p>Try a different search or filter.</p>';
    screen.querySelector('.table-wrap')?.insertAdjacentElement('afterend',empty);
  }
  empty.hidden=visible>0;
}

function renderSectionTab(kind,label){
  const key=label.trim().toLowerCase();
  const target=kind==='publicEvent'?screen.querySelector('[data-tab-panel="publicEvent"]'):screen.querySelector('#organizerTabPanel');
  if(!target)return;
  if(key==='overview'){target.innerHTML=target.dataset.defaultHtml;return;}
  const publicViews={
    challenges:`<div class="section-head" style="margin-top:0"><h2>Challenges</h2><span>2 PUBLISHED</span></div><div class="listrow"><span class="initial">01</span><div><strong>Blue economy</strong><p>Design tools that support healthy oceans and resilient coastal communities.</p></div><span class="pill signal hide-mobile">Open</span><span></span></div><div class="listrow"><span class="initial">02</span><div><strong>Island mobility</strong><p>Make everyday travel between communities simpler and more sustainable.</p></div><span class="pill signal hide-mobile">Open</span><span></span></div>`,
    teams:`<div class="section-head" style="margin-top:0"><h2>Participating teams</h2><span>PUBLIC TEAM PROFILES</span></div><div class="grid g2"><div class="panel"><span class="pill signal">BLUE ECONOMY</span><h3>Ocean Coders</h3><p class="muted small">Building TideWatch for coastal communities.</p><span class="small quiet">3 participants</span></div><div class="panel"><span class="pill">ISLAND MOBILITY</span><h3>Route Lab</h3><p class="muted small">Rethinking how people move between islands.</p><span class="small quiet">4 participants</span></div></div>`,
    ranking:`<div class="section-head" style="margin-top:0"><h2>Live ranking</h2><span>EXAMPLE RESULTS</span></div><div class="table-wrap panel"><table class="table"><thead><tr><th>Rank</th><th>Team</th><th>Project</th><th>Score</th></tr></thead><tbody><tr><td>01</td><td>Ocean Coders</td><td>TideWatch</td><td>92.4</td></tr><tr><td>02</td><td>Route Lab</td><td>Island Routes</td><td>88.1</td></tr><tr><td>03</td><td>Solar Stack</td><td>SunShare</td><td>84.7</td></tr></tbody></table></div><p class="quiet small">Scores are illustrative and update after project evaluations.</p>`,
    faq:`<div class="section-head" style="margin-top:0"><h2>Frequently asked questions</h2><span>EVENT INFO</span></div><details class="panel"><summary>Who can participate?</summary><p class="muted small">Anyone curious about building useful digital products can register.</p></details><details class="panel" style="margin-top:10px"><summary>Do I need a team?</summary><p class="muted small">No. You can meet collaborators during the opening session.</p></details><details class="panel" style="margin-top:10px"><summary>What should I bring?</summary><p class="muted small">Bring a laptop, charger and anything you need to present your idea.</p></details>`
  };
  const organizerViews={
    challenges:`<div class="section-head" style="margin-top:0"><h2>Challenge management</h2><button class="btn smallbtn">＋ Add challenge</button></div><div class="panel"><div class="row" style="justify-content:space-between"><div><strong>Blue economy</strong><p class="muted small">Design for healthier oceans and stronger coastal communities.</p></div><span class="pill live">Published</span></div></div><div class="panel" style="margin-top:10px"><div class="row" style="justify-content:space-between"><div><strong>Island mobility</strong><p class="muted small">Improve how people and goods move between communities.</p></div><span class="pill live">Published</span></div></div>`,
    teams:`<div class="section-head" style="margin-top:0"><h2>Teams</h2><span>2 REGISTERED</span></div><div class="grid g2"><div class="panel"><span class="pill signal">BLUE ECONOMY</span><h3>Ocean Coders</h3><p class="muted small">3 members · Project submitted</p></div><div class="panel"><span class="pill">ISLAND MOBILITY</span><h3>Route Lab</h3><p class="muted small">4 members · Project in progress</p></div></div>`,
    registrations:`<div class="section-head" style="margin-top:0"><div><h2>Participant registrations</h2><p class="muted small">Contact details are visible to this event’s organizer.</p></div><button class="btn secondary smallbtn">Export list ↓</button></div><div class="table-wrap panel"><table class="table"><thead><tr><th>Participant</th><th>Email</th><th>Registered</th><th></th></tr></thead><tbody><tr><td>Joana Monteiro</td><td>joana@example.com</td><td>Today, 09:16</td><td><button class="btn ghost smallbtn">Remove</button></td></tr><tr><td>David Neves</td><td>david@example.com</td><td>Today, 08:42</td><td><button class="btn ghost smallbtn">Remove</button></td></tr><tr><td>Inês Andrade</td><td>ines@example.com</td><td>Yesterday</td><td><button class="btn ghost smallbtn">Remove</button></td></tr></tbody></table></div>`,
    evaluations:`<div class="section-head" style="margin-top:0"><div><h2>Evaluations and results</h2><p class="muted small">Review project scores and the public ranking.</p></div><button class="btn secondary smallbtn">Export evaluations ↓</button></div><div class="table-wrap panel"><table class="table"><thead><tr><th>Team</th><th>Submitted</th><th>Evaluations</th><th>Average</th></tr></thead><tbody><tr><td>Ocean Coders</td><td>Yes</td><td>3</td><td>92.4</td></tr><tr><td>Route Lab</td><td>Yes</td><td>2</td><td>88.1</td></tr><tr><td>Solar Stack</td><td>Pending</td><td>0</td><td>—</td></tr></tbody></table></div>`
  };
  target.innerHTML=(kind==='publicEvent'?publicViews:organizerViews)[key]||target.dataset.defaultHtml;
}

function render(key){
  active=pages[key]?key:'notFound';
  const p=pages[active];
  document.getElementById('breadcrumb').textContent=p.name;
  document.getElementById('routePath').textContent=routePaths.get(active)||'/not-found';
  screen.classList.remove('screen-enter');
  screen.innerHTML=p.html()+`<footer class="foot"><span>HACKHUB · EVENT WORKSPACE</span><span>SCREEN ${String(Object.keys(pages).indexOf(active)+1).padStart(2,'0')} / ${Object.keys(pages).length}</span></footer>`;
  screen.querySelectorAll('[data-tab-panel],#organizerTabPanel').forEach(panel=>panel.dataset.defaultHtml=panel.innerHTML);
  void screen.offsetWidth;
  screen.classList.add('screen-enter');
  document.querySelectorAll('.navitem').forEach(el=>{
    const selected=el.dataset.route===active;
    el.classList.toggle('active',selected);
    if(selected)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
  });
  screen.querySelectorAll('.listrow[data-route]').forEach(row=>{
    row.tabIndex=0;
    row.setAttribute('role','link');
    row.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' '){event.preventDefault();render(row.dataset.route);}});
  });
  screen.querySelectorAll('.tabs .tab, .toolbar .tab').forEach(tab=>tab.addEventListener('click',()=>{
    tab.parentElement.querySelectorAll('.tab').forEach(sibling=>sibling.classList.toggle('active',sibling===tab));
    tab.parentElement.querySelectorAll('.tab').forEach(sibling=>sibling.setAttribute('aria-selected',String(sibling===tab)));
    if(tab.dataset.filter){if(active==='events')applyEventFilters();if(active==='manageEvents')applyOrganizerFilters();}
    const kind=tab.closest('[data-tab-kind]')?.dataset.tabKind;
    if(kind)renderSectionTab(kind,tab.textContent);
  }));
  screen.querySelector('input[aria-label="Search events"]')?.addEventListener('input',applyEventFilters);
  screen.querySelector('input[aria-label="Search your events"]')?.addEventListener('input',applyOrganizerFilters);
  screen.querySelectorAll('form').forEach(form=>form.addEventListener('submit',event=>{
    event.preventDefault();
    notify('This is a visual preview. No data was sent or saved.',true);
  }));
  applyEventFilters();
  applyOrganizerFilters();
  closeDrawer();
  window.scrollTo({top:0,behavior:window.matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}

screen.addEventListener('click',event=>{
  const route=event.target.closest('[data-route]');
  if(route&&screen.contains(route)){event.preventDefault();render(route.dataset.route);return;}
  const action=event.target.closest('[data-action]');
  if(action&&screen.contains(action)){openDialog(action.dataset.action,action);return;}
  const button=event.target.closest('button');
  if(!button||button.closest('form')||button.classList.contains('tab'))return;
  const text=button.textContent.trim();
  notify(text.includes('Try again')?'Preview retry selected; no server request was made.':'This control is shown for review; the live product flow is not connected here.',true);
});

routeGroups.forEach(group=>{
  const target=document.getElementById(group.group);
  group.items.forEach(([key,icon,label,path])=>{
    const button=document.createElement('button');
    button.className='navitem';
    button.dataset.route=key;
    button.innerHTML=`<span class="ni" aria-hidden="true">${icon}</span><span>${label}</span>`;
    button.title=path;
    button.onclick=()=>render(key);
    target.appendChild(button);
  });
});

const themeToggle=document.getElementById('themeToggle');
function setTheme(theme){
  const light=theme==='light';
  app.dataset.theme=light?'light':'dark';
  document.getElementById('themeText').textContent=light?'Dark theme':'Light theme';
  document.getElementById('themeIcon').textContent=light?'☾':'☼';
  themeToggle.setAttribute('aria-pressed',String(light));
  try{localStorage.setItem('hackhub-preview-theme',app.dataset.theme);}catch{}
}
themeToggle.onclick=()=>setTheme(app.dataset.theme==='dark'?'light':'dark');
try{setTheme(localStorage.getItem('hackhub-preview-theme')||'dark');}catch{setTheme('dark');}

document.getElementById('mobileToggle').onclick=()=>{
  const open=!rail.classList.contains('drawer-open');
  rail.classList.toggle('drawer-open',open);
  backdrop.classList.toggle('visible',open);
  const toggle=document.getElementById('mobileToggle');
  toggle.setAttribute('aria-expanded',String(open));
  toggle.setAttribute('aria-label',open?'Close page navigation':'Open page navigation');
};
backdrop.onclick=closeDrawer;
document.addEventListener('keydown',event=>{
  if(event.key==='Escape'){if(activeDialog)closeDialog();else closeDrawer();return;}
  if(event.key==='Tab'&&activeDialog){
    const focusable=[...activeDialog.querySelectorAll('button,input,textarea,select,[href]')].filter(el=>!el.disabled);
    const first=focusable[0],last=focusable[focusable.length-1];
    if(event.shiftKey&&document.activeElement===first){event.preventDefault();last.focus();}
    else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first.focus();}
  }
});
render('home');
</script></body></html>
