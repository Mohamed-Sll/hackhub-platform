<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" fill="none" role="img" aria-labelledby="title description">
  <title id="title">HackHub — build something worth showing</title>
  <desc id="description">A dark purple abstract banner illustrating a hackathon workspace with connected teams, project submissions, judging, and results.</desc>
  <defs>
    <linearGradient id="background" x1="112" y1="0" x2="1320" y2="460" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111126"/>
      <stop offset=".56" stop-color="#17152E"/>
      <stop offset="1" stop-color="#20133B"/>
    </linearGradient>
    <linearGradient id="violet" x1="119" y1="97" x2="442" y2="375" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D9F99D"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" stroke="#C4B5FD" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

  <rect width="1440" height="460" rx="28" fill="url(#background)"/>
  <rect width="1440" height="460" rx="28" fill="url(#grid)"/>
  <circle cx="1157" cy="231" r="159" fill="#8B5CF6" fill-opacity=".18" filter="url(#glow)"/>
  <circle cx="1299" cy="83" r="4" fill="#D9F99D"/>
  <circle cx="1100" cy="366" r="3" fill="#C4B5FD" fill-opacity=".8"/>
  <circle cx="1380" cy="303" r="3" fill="#D9F99D" fill-opacity=".8"/>

  <g transform="translate(82 83)">
    <rect width="52" height="52" rx="16" fill="url(#violet)"/>
    <path d="M16 16h9l11 20h-9L16 16Zm0 0v20h9V16m20 0h-9v20h9V16Z" fill="#fff" fill-opacity=".95"/>
  </g>
  <text x="151" y="120" fill="#EDE9FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing=".4">HACKHUB</text>
  <rect x="82" y="173" width="177" height="30" rx="15" fill="#A78BFA" fill-opacity=".12" stroke="#A78BFA" stroke-opacity=".32"/>
  <circle cx="100" cy="188" r="4" fill="#BEF264"/>
  <text x="113" y="193" fill="#D8B4FE" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">OPEN SOURCE PLATFORM</text>
  <text x="78" y="263" fill="#FFFFFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" letter-spacing="-2.4">Build what</text>
  <text x="78" y="333" fill="#C4B5FD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="64" font-weight="750" letter-spacing="-2.4">comes next.</text>
  <text x="82" y="380" fill="#B7B6C9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">One workspace for every stage of a hackathon.</text>

  <g transform="translate(822 76)">
    <path d="M78 92 244 30l65 168-166-62-65 118-22-84-56-33 78-45Z" fill="#A78BFA" fill-opacity=".11" stroke="#A78BFA" stroke-opacity=".32" stroke-width="1.5"/>
    <path d="m241 37 54 155-150-56 96-99Z" fill="#A78BFA" fill-opacity=".13"/>
    <path d="m98 119 150-82M145 136l97-99M113 245l30-109" stroke="#A78BFA" stroke-opacity=".26"/>
    <circle cx="180" cy="129" r="82" fill="#A78BFA" fill-opacity=".1" stroke="#C4B5FD" stroke-opacity=".35" stroke-width="1.5"/>
    <circle cx="180" cy="129" r="56" fill="#1B1834" stroke="#8B5CF6" stroke-opacity=".58" stroke-width="1.5"/>
    <path d="M162 147V111h9l18 22v-22h9v36h-8l-19-23v23h-9Z" fill="#EDE9FE"/>
    <circle cx="180" cy="129" r="94" stroke="#D9F99D" stroke-opacity=".42" stroke-dasharray="3 9"/>
    <circle cx="259" cy="91" r="6" fill="url(#lime)"/>
    <circle cx="95" cy="179" r="5" fill="#C4B5FD"/>
    <circle cx="208" cy="224" r="5" fill="url(#lime)"/>

    <g transform="translate(327 21)">
      <rect width="200" height="78" rx="16" fill="#221F3D" stroke="#FFFFFF" stroke-opacity=".13"/>
      <rect x="16" y="17" width="34" height="34" rx="11" fill="#8B5CF6" fill-opacity=".22"/>
      <path d="M26 34h14M33 27v14" stroke="#C4B5FD" stroke-width="2" stroke-linecap="round"/>
      <text x="62" y="34" fill="#F5F3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">CREATE EVENT</text>
      <text x="62" y="53" fill="#A7A5BA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Set the challenge in motion</text>
      <circle cx="180" cy="20" r="4" fill="#BEF264"/>
    </g>
    <g transform="translate(286 272)">
      <rect width="224" height="82" rx="16" fill="#221F3D" stroke="#FFFFFF" stroke-opacity=".13"/>
      <rect x="16" y="19" width="38" height="38" rx="12" fill="#A3E635" fill-opacity=".14"/>
      <path d="M27 47V37l8-7 8 7v10h-6v-7h-5v7h-5Z" fill="#D9F99D"/>
      <text x="67" y="38" fill="#F5F3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">TEAMS, IDEAS,</text>
      <text x="67" y="56" fill="#F5F3FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">REAL PROJECTS</text>
      <path d="M185 42h20" stroke="#D9F99D" stroke-width="2" stroke-linecap="round"/>
      <path d="m199 35 7 7-7 7" stroke="#D9F99D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
